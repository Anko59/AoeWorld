[package]
name = "aoeworld-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
aoe-assets = { path = "../crates/assets" }
libfuzzer-sys = "=0.4.10"

[workspace]

[[bin]]
name = "drs"
path = "fuzz_targets/drs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "slp"
path = "fuzz_targets/slp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "palette"
path = "fuzz_targets/palette.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false
