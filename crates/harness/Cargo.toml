[package]
name = "aoe-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aoe-assets = { path = "../assets" }
aoe-core.workspace = true
aoe-scenario.workspace = true
aoe-simulation.workspace = true
aoe-protocol.workspace = true
aoe-server = { path = "../server" }
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
serde_json = "1.0"
thiserror.workspace = true
nix = { version = "0.30", features = ["user", "signal", "process"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "net", "sync"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
axum = "0.8"
url = "2.5"
blake3 = "1.8"

[dev-dependencies]
tempfile = "3.27"
