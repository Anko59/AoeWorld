[package]
name = "aoe-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
aoe-core.workspace = true
aoe-protocol.workspace = true
aoe-simulation.workspace = true
aoe-scenario.workspace = true
aoe-rendering = { path = "../rendering" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "Document", "Element", "Event", "EventTarget", "HtmlCanvasElement", "HtmlElement", "HtmlSelectElement", "KeyboardEvent", "MessageEvent", "Location", "Performance", "Request", "RequestInit", "Response", "UrlSearchParams", "WebSocket", "WheelEvent", "Window"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.78"
