[package]
name = "aoe-rendering"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
aoe-core.workspace = true
aoe-assets = { path = "../assets" }
aoe-protocol.workspace = true
bytemuck = { version = "1.23", features = ["derive"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "Document", "Element", "Node", "Window"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.78"
