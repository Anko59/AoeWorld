[package]
name = "aoe-rendering"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
aoe-core.workspace = true
aoe-protocol.workspace = true
bytemuck = { version = "1.23", features = ["derive"] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "Document", "Element", "Node"] }
wgpu = { version = "30.0", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2"
