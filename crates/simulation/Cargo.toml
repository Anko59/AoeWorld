[package]
name = "aoe-simulation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Native canonical data is also available to browser-test fixtures, never the
# production client bundle. Runtime consumers use BrowserContent::decode.
content-source = []
# Data factories for profiling only; movement has one implementation.
bench-fixtures = []

[dependencies]
aoe-core.workspace = true
aoe-map.workspace = true
aoe-scenario.workspace = true
blake3 = "1.8"
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gungraun = { version = "=0.19.4", features = ["client_requests"] }

[[bench]]
name = "instructions"
harness = false

[[bench]]
name = "late_game_instructions"
harness = false

[[bench]]
name = "movement_instructions"
harness = false

[[bench]]
name = "group_instructions"
harness = false
