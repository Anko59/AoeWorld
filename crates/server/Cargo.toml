[package]
name = "aoe-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bench-fixtures = []

[dependencies]
aoe-core.workspace = true
aoe-map.workspace = true
aoe-scenario.workspace = true
aoe-simulation.workspace = true
aoe-protocol = { workspace = true, features = ["server-repair"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
rayon = "1.12"
serde.workspace = true
serde_json = "1.0"
postcard = { version = "1.1", features = ["alloc"] }
thiserror.workspace = true
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
memmap2 = "0.9.12"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }

[dev-dependencies]
gungraun = { version = "=0.19.4", features = ["client_requests"] }
tokio-tungstenite = "0.29"

[[bench]]
name = "census_instructions"
harness = false
required-features = ["bench-fixtures"]
