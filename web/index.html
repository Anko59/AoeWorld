<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AoeWorld</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body, #playground { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #172516; color: #e8efd9; font: 14px system-ui, sans-serif; }
    #scene { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; outline: none; }
    #controls { position: fixed; top: 14px; right: 14px; z-index: 2; display: flex; gap: 7px; }
    button { color: #eef6dc; background: #243c25dd; border: 1px solid #78915d; border-radius: 4px; padding: 7px 10px; cursor: pointer; }
    button:hover { background: #3e5a35; }
    #status { position: fixed; left: 14px; bottom: 14px; z-index: 2; padding: 7px 10px; color: #dce9c9; background: #142314d9; border: 1px solid #60764d; border-radius: 4px; }
    #connection { color: #d2e5a7; }
    #unsupported { position: fixed; left: 14px; top: 14px; z-index: 3; max-width: 420px; color: #ffd29a; }
  </style>
</head>
<body>
  <main id="playground">
    <canvas id="scene" tabindex="0" aria-label="AoeWorld isometric map. Select a unit and right-click to move."></canvas>
    <nav id="controls" aria-label="Map controls">
      <button id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
      <button id="recenter" type="button" aria-label="Center on primary unit" title="Center unit">⌾</button>
      <button id="grid" type="button" aria-label="Toggle isometric grid" title="Grid">▦</button>
      <button id="reconnect" type="button" aria-label="Reconnect to server" title="Reconnect">↻</button>
    </nav>
    <div id="status" role="status"><span id="connection">Loading…</span> · <span id="world-position">8192.0, 8192.0</span></div>
    <p id="unsupported" role="alert"></p>
  </main>
  <script type="module">
    import init from '/pkg/aoe_client.js';
    init().catch(error => {
      document.getElementById('connection').textContent = 'Unavailable';
      document.getElementById('unsupported').textContent = `Unable to start AoeWorld: ${error}`;
    });
  </script>
</body>
</html>
