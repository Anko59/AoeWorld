<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AoeWorld diagnostics</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e151f; color: #e8edf5; font: 14px system-ui, sans-serif; }
    main { display: flex; flex-direction: column; height: 100%; }
    header { padding: 12px 18px; display: flex; align-items: center; gap: 18px; background: #172334; }
    h1 { font-size: 18px; margin: 0; }
    p { margin: 0; }
    button, select { color: white; background: #345a80; border: 0; border-radius: 4px; padding: 8px 12px; cursor: pointer; }
    #scene { width: 100%; height: calc(100% - 112px); display: block; }
    #asset-viewer-frame { width: 100%; height: calc(100% - 112px); border: 0; }
    #scene[hidden], #asset-viewer-frame[hidden] { display: none; }
    footer { min-height: 36px; padding: 10px 18px; background: #172334; }
    #unsupported { color: #ffb2a6; }
    header a { color: #9ed6ff; }
  </style>
</head>
<body>
<main>
  <header><a href="/">AoeWorld</a><h1>AoeWorld diagnostics</h1><label for="scenario">Scenario</label><select id="scenario"><option value="smoke">Smoke</option><option value="target-distributed">Target distributed</option><option value="target-hotspot">Target hotspot</option></select><p>Arrows/WASD move · +/- or wheel zoom · Space pauses view</p><button id="reconnect">Reconnect</button><select id="asset-mode" aria-label="Asset view" hidden><option value="synthetic">Synthetic lab</option><option value="imported">Imported sprites</option></select><a id="assets" href="/asset-viewer.html" hidden>Open viewer</a></header>
  <canvas id="scene" width="1280" height="720" aria-label="Synthetic entity field"></canvas>
  <iframe id="asset-viewer-frame" title="Imported sprite viewer" hidden></iframe>
  <footer><div id="diagnostics" role="status">Starting…</div><div id="unsupported" role="alert"></div></footer>
</main>
<script type="module">import init from '/pkg/aoe_client.js'; init();</script>
<script type="module">
  const mode = document.getElementById('asset-mode');
  const scene = document.getElementById('scene');
  const viewer = document.getElementById('asset-viewer-frame');
  mode.addEventListener('change', () => {
    const imported = mode.value === 'imported';
    scene.hidden = imported;
    viewer.hidden = !imported;
    if (imported && !viewer.src) viewer.src = '/asset-viewer.html';
  });
  fetch('/asset-pack/manifest.json', { method: 'HEAD' }).then(response => {
    if (response.ok) {
      mode.hidden = false;
      document.getElementById('assets').hidden = false;
    }
  });
</script>
</body>
</html>
