<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AoeWorld local asset viewer</title>
  <style>
    body { margin: 0; background: #101820; color: #e8edf5; font: 14px system-ui, sans-serif; }
    header, section { padding: 14px 20px; }
    header { background: #1b2b3c; display: flex; align-items: center; gap: 18px; }
    h1 { margin: 0; font-size: 18px; }
    a { color: #9ed6ff; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    label { display: grid; gap: 4px; }
    input, select, button { background: #29455f; color: white; border: 1px solid #6085a1; border-radius: 4px; padding: 7px; }
    #source { max-width: min(80vw, 550px); }
    #preview { display: block; width: min(100%, 960px); height: auto; background: #202b31; image-rendering: pixelated; }
    #status { min-height: 22px; }
    #details { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header><h1>Local asset viewer</h1><a href="/">Harness Lab</a></header>
  <section class="controls">
    <label>Filter source<input id="filter" type="search" placeholder="Resource ID or archive"></label>
    <label>Source<select id="source"></select></label>
    <label>Frame<input id="frame" type="number" min="0" value="0"></label>
    <label>Player color<input id="player-color" type="color" value="#479de0"></label>
    <button id="previous" type="button">Previous</button>
    <button id="next" type="button">Next</button>
  </section>
  <section><p id="status" role="status">Loading local pack…</p><p id="details"></p></section>
  <section><canvas id="preview" width="960" height="600" aria-label="Imported sprite frame"></canvas></section>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const canvas = $('preview');
    const context = canvas.getContext('2d');
    context.imageSmoothingEnabled = false;
    const mask = document.createElement('canvas');
    const maskContext = mask.getContext('2d', { willReadFrequently: true });
    const images = new Map();
    let manifest;
    let sources;
    let generation = 0;

    function image(name) {
      if (!images.has(name)) {
        images.set(name, new Promise((resolve, reject) => {
          const element = new Image();
          element.onload = () => resolve(element);
          element.onerror = () => reject(new Error(`Cannot load ${name}`));
          element.src = `/asset-pack/${encodeURIComponent(name)}`;
        }));
      }
      return images.get(name);
    }

    function tint(source, frame, color, outline = false) {
      mask.width = frame.width;
      mask.height = frame.height;
      maskContext.clearRect(0, 0, mask.width, mask.height);
      maskContext.drawImage(source, frame.x, frame.y, frame.width, frame.height,
        0, 0, frame.width, frame.height);
      const pixels = maskContext.getImageData(0, 0, frame.width, frame.height);
      for (let index = 0; index < pixels.data.length; index += 4) {
        if (pixels.data[index + 3] === 0) continue;
        const shade = outline ? 1 : 0.65 + pixels.data[index] / 255 * 0.35;
        pixels.data[index] = Math.round(color[0] * shade);
        pixels.data[index + 1] = Math.round(color[1] * shade);
        pixels.data[index + 2] = Math.round(color[2] * shade);
      }
      maskContext.putImageData(pixels, 0, 0);
      return mask;
    }

    async function render() {
      if (!manifest || !sources) return;
      const selected = sources.get($('source').value);
      if (!selected?.length) return;
      const index = Math.max(0, Math.min(selected.length - 1, Number($('frame').value) || 0));
      $('frame').value = index;
      $('frame').max = selected.length - 1;
      const frame = selected[index];
      const page = manifest.pages[frame.page];
      const current = ++generation;
      try {
        const [color, player, shadow, outline] = await Promise.all(
          [page.color, page.player, page.shadow, page.outline].map(image));
        if (current !== generation) return;
        context.clearRect(0, 0, canvas.width, canvas.height);
        const scale = Math.min(4, (canvas.width - 32) / frame.width,
          (canvas.height - 32) / frame.height);
        const width = frame.width * scale;
        const height = frame.height * scale;
        const x = (canvas.width - width) / 2;
        const y = (canvas.height - height) / 2;
        const draw = (source) => context.drawImage(source, frame.x, frame.y,
          frame.width, frame.height, x, y, width, height);
        draw(shadow);
        draw(color);
        const hex = $('player-color').value;
        const playerColor = [1, 3, 5].map((start) => parseInt(hex.slice(start, start + 2), 16));
        context.drawImage(tint(player, frame, playerColor), x, y, width, height);
        context.drawImage(tint(outline, frame, [230, 220, 180], true), x, y, width, height);
        $('details').textContent = `${frame.source} · frame ${frame.frame} of ${selected.length}` +
          ` · ${frame.width} × ${frame.height} · anchor (${frame.anchor_x}, ${frame.anchor_y})` +
          ` · atlas page ${frame.page + 1} of ${manifest.pages.length}`;
        $('status').textContent = `${manifest.frames.length} frames from ${sources.size} sources`;
      } catch (error) {
        $('status').textContent = String(error);
      }
    }

    function fillSources() {
      const previous = $('source').value;
      const query = $('filter').value.toLowerCase();
      $('source').replaceChildren();
      for (const name of sources.keys()) {
        if (!name.toLowerCase().includes(query)) continue;
        $('source').add(new Option(`${name} (${sources.get(name).length})`, name));
      }
      if (sources.has(previous) && previous.toLowerCase().includes(query)) {
        $('source').value = previous;
      }
      $('frame').value = 0;
      render();
    }

    $('filter').addEventListener('input', fillSources);
    $('source').addEventListener('change', () => { $('frame').value = 0; render(); });
    $('frame').addEventListener('change', render);
    $('player-color').addEventListener('input', render);
    $('previous').addEventListener('click', () => { $('frame').value--; render(); });
    $('next').addEventListener('click', () => { $('frame').value++; render(); });
    try {
      const response = await fetch('/asset-pack/manifest.json');
      if (!response.ok) throw new Error('No local pack selected. Set AOE_ASSET_PACK when starting make dev.');
      manifest = await response.json();
      sources = new Map();
      for (const frame of manifest.frames) {
        if (!sources.has(frame.source)) sources.set(frame.source, []);
        sources.get(frame.source).push(frame);
      }
      fillSources();
    } catch (error) {
      $('status').textContent = String(error);
    }
  </script>
</body>
</html>
