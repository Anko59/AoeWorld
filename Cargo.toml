[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/map",
  "crates/geodata",
  "crates/scenario",
  "crates/simulation",
  "crates/protocol",
  "crates/rendering",
  "crates/client",
  "crates/assets",
  "crates/server",
  "crates/harness",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93"

[workspace.dependencies]
aoe-core = { path = "crates/core" }
aoe-map = { path = "crates/map" }
aoe-geodata = { path = "crates/geodata" }
aoe-scenario = { path = "crates/scenario" }
aoe-simulation = { path = "crates/simulation" }
aoe-protocol = { path = "crates/protocol" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
