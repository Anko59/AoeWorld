name: AoeWorld weekly validation

on:
  schedule:
    - cron: '43 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
      - uses: ./.github/actions/docker-setup
      - run: make bootstrap
      - run: make perf-soak-30
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: weekly-network-soak
          path: |
            reports/perf/soak-30.json
            reports/perf/soak-30.md
          retention-days: 30
          if-no-files-found: ignore

  beyond-target-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
      - uses: ./.github/actions/docker-setup
      - run: make bootstrap
      - run: make perf-stress
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: weekly-beyond-target-stress
          path: |
            reports/perf/stress.json
            reports/perf/stress.md
          retention-days: 30
          if-no-files-found: ignore
