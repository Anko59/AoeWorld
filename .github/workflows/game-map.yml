name: AoeWorld game map cache

# Warms the Actions cache with the owner's Anatolia map package (qa/anatolia-map.json) so that no job
# fetches third-party geodata at pull-request time. Caches only: one source layer is CC BY-SA 4.0 and
# redistribution (a release asset or a workflow artifact) is the owner's decision (docs/geodata/licences.md).
# Manual only: data.hydrosheds.org refuses GitHub runners (HTTP 403) and the owner has not yet decided how the
# map reaches CI, so no push or schedule starts a job that can only fail; start it by hand once it can be fetched or seeded.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-map
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
      - id: map
        uses: ./.github/actions/game-map-restore
        with:
          fallback: 'false'
      - name: Cache is warm
        if: steps.map.outputs.exact == 'true'
        run: echo "::notice::game map cache already holds ${{ steps.map.outputs.cache-key }}; the restore touched it to keep it alive"
      - name: Free disk for the sources
        if: steps.map.outputs.exact != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - if: steps.map.outputs.exact != 'true'
        uses: ./.github/actions/docker-setup
        with:
          cache: 'false'
      - name: Fetch the sources and generate the package
        if: steps.map.outputs.exact != 'true'
        # An explicit shell turns on pipefail: a failed `make` must stop the job before the save step,
        # or an empty package directory would be saved under the exact key and look warm forever.
        shell: bash
        run: |
          start=$(date +%s)
          make game-map | tee game-map.log
          echo "generation took $(( $(date +%s) - start )) s" | tee -a game-map.log
          du -sh .cache/geodata .cache/game-map/packages | tee -a game-map.log
      - name: What the runner can reach (diagnostic, after a failure only)
        if: failure() && steps.map.outputs.exact != 'true'
        shell: bash
        run: |
          # A plain request with curl's own user agent, first 100 bytes, for the two HydroSHEDS files
          # (the sources a GitHub runner could not fetch on 2026-11-26: HTTP 403).
          for url in https://data.hydrosheds.org/file/HydroLAKES/HydroLAKES_polys_v10.gdb.zip https://data.hydrosheds.org/file/HydroRIVERS/HydroRIVERS_v10_eu_shp.zip; do
            echo "== $url"
            curl -sS -o /dev/null -D - -m 30 -r 0-99 "$url" | head -12 || true
          done | tee -a game-map.log
      - name: Save the package to the cache
        if: steps.map.outputs.exact != 'true' && hashFiles('.cache/game-map/packages/*.json') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .cache/game-map/packages
          key: ${{ steps.map.outputs.cache-key }}
      - if: always() && hashFiles('game-map.log') != ''
        run: |
          { echo '### Game map'; echo '```'; cat game-map.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
