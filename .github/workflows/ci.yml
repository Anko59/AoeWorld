name: AoeWorld validation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
      native_coverage: ${{ steps.manifest.outputs.native_coverage }}
      browser: ${{ steps.manifest.outputs.browser }}
      target_performance: ${{ steps.manifest.outputs.target_performance }}
      fuzz_smoke: ${{ steps.manifest.outputs.fuzz_smoke }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: make tools
      - id: manifest
        env:
          AOE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make ci-select
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-selection
          path: reports/gates/selection.json
          retention-days: 7

  static:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make bootstrap
      - run: make preflight

  native-coverage:
    needs: select
    if: ${{ needs.select.outputs.native_coverage == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make coverage
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-coverage-report
          path: reports/coverage/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    needs: select
    if: ${{ needs.select.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make bootstrap
      - run: make browser-check
      - run: make test-wasm
      - run: make test-e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-diagnostics
          path: browser/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-browser-report
          path: reports/wasm/
          retention-days: 7
          if-no-files-found: ignore

  target-performance:
    needs: select
    if: ${{ needs.select.outputs.target_performance == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make bootstrap
      - run: make perf-ci
      - run: make perf-pressure
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-report
          path: reports/perf/
          retention-days: 30
          if-no-files-found: ignore

  fuzz-smoke:
    needs: select
    if: ${{ needs.select.outputs.fuzz_smoke == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make fuzz-smoke
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parser-fuzz-smoke
          path: |
            reports/fuzz/
            fuzz/artifacts/
          retention-days: 7
          if-no-files-found: ignore

  required:
    if: always()
    needs: [select, static, native-coverage, browser, target-performance, fuzz-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: make tools
      - name: Validate selection and selected jobs
        env:
          AOE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AOE_SELECTION_JSON: ${{ needs.select.outputs.manifest }}
          AOE_JOB_RESULTS_JSON: >-
            {"select":"${{ needs.select.result }}","static":"${{ needs.static.result }}","native-coverage":"${{ needs['native-coverage'].result }}","browser":"${{ needs.browser.result }}","target-performance":"${{ needs['target-performance'].result }}","fuzz-smoke":"${{ needs['fuzz-smoke'].result }}"}
        run: make ci-check
