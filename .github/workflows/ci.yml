name: AoeWorld validation

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make bootstrap
      - run: make preflight

  native-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make coverage
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-coverage-report
          path: reports/coverage/
          retention-days: 7
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make bootstrap
      - run: make browser-check
      - run: make test-wasm
      - run: make test-e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-diagnostics
          path: browser/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wasm-browser-report
          path: reports/wasm/
          retention-days: 7
          if-no-files-found: ignore

  target-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make bootstrap
      - run: make perf-ci
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-report
          path: reports/perf/
          retention-days: 30
          if-no-files-found: ignore

  required:
    if: always()
    needs: [static, native-coverage, browser, target-performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected jobs
        env:
          STATIC: ${{ needs.static.result }}
          COVERAGE: ${{ needs['native-coverage'].result }}
          BROWSER: ${{ needs.browser.result }}
          PERFORMANCE: ${{ needs.target-performance.result }}
        run: test "$STATIC" = success && test "$COVERAGE" = success && test "$BROWSER" = success && test "$PERFORMANCE" = success
