name: AoeWorld validation

on:
  # Every base: a stacked pull request (docs/shipping.md) needs the same jobs.
  pull_request:
    branches: ['**']
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
      native_coverage: ${{ steps.manifest.outputs.native_coverage }}
      browser: ${{ steps.manifest.outputs.browser }}
      e2e: ${{ steps.manifest.outputs.e2e }}
      target_performance: ${{ steps.manifest.outputs.target_performance }}
      fuzz_smoke: ${{ steps.manifest.outputs.fuzz_smoke }}
      qualification: ${{ steps.manifest.outputs.qualification }}
      exhaustive: ${{ steps.manifest.outputs.exhaustive }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: ./.github/actions/docker-setup
      - run: make tools
      - id: manifest
        env:
          AOE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: make ci-select
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-selection
          path: reports/gates/selection.json
          retention-days: 7

  static:
    # `make preflight` as two parallel legs, both required (#388, docs/testing.md).
    needs: select
    strategy:
      fail-fast: false
      matrix: { part: [checks, unit] }
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/docker-setup
      - uses: ./.github/actions/rust-cache-restore
        with: { leg: '${{ matrix.part }}' }
      - run: make bootstrap
      - run: make preflight-${{ matrix.part }}
      - uses: ./.github/actions/rust-cache-save
        with: { leg: '${{ matrix.part }}' }

  native-coverage:
    needs: select
    if: ${{ needs.select.outputs.native_coverage == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/docker-setup
      - run: make coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: { name: native-coverage-report, path: reports/coverage/, retention-days: 7, if-no-files-found: ignore }
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: { name: release-e2e-evidence, path: reports/e2e/pass.json, retention-days: 7, if-no-files-found: error }

  browser:
    needs: select
    if: ${{ needs.select.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/docker-setup
      - run: make bootstrap
      - run: make browser-check
      - run: make test-wasm
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-diagnostics
          path: |
            reports/perf/browser.json
            reports/process/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: { name: wasm-browser-report, path: reports/wasm/, retention-days: 7, if-no-files-found: ignore }

  e2e:
    # The Playwright suite in three parallel shards (#388): the same make
    # test-e2e, with AOE_E2E_SHARD naming one part. The job's result is
    # success only when every shard passed, and `required` checks that result.
    needs: select
    if: ${{ needs.select.outputs.e2e == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/docker-setup
      - run: make bootstrap
      - run: make test-e2e
        env:
          AOE_E2E_SHARD: ${{ matrix.shard }}/3
          # One worker on the 4-core runner: software (SwiftShader) rendering is
          # CPU-bound, and three servers per shard timed out heavy specs (#457).
          AOE_E2E_WORKERS: '1'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-${{ matrix.shard }}-diagnostics
          path: |
            browser/test-results/
            reports/e2e/
            reports/process/
          retention-days: 7
          if-no-files-found: ignore

  target-performance:
    needs: select
    if: ${{ needs.select.outputs.target_performance == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/docker-setup
      - run: make bootstrap
      - run: make perf-ci
      - run: make perf-pressure
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: { name: performance-report, path: reports/perf/, retention-days: 30, if-no-files-found: ignore }

  perf-comment:
    # Item 12 of #388: the measured numbers reach the pull request as ONE
    # informational comment, updated in place. It is never a gate: the
    # failing checks stay the checks, and this job does not block the merge.
    needs: [target-performance]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.target-performance.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/docker-setup
      - run: make bootstrap
      - run: make perf-comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AOE_PR_NUMBER: ${{ github.event.pull_request.number }}

  fuzz-smoke:
    needs: select
    if: ${{ needs.select.outputs.fuzz_smoke == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/docker-setup
      - run: make fuzz-smoke
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: { name: parser-fuzz-smoke, path: "reports/fuzz/\nfuzz/artifacts/", retention-days: 7, if-no-files-found: ignore }

  # Post-merge tier: runs on pushes to dev/main and nightly; PRs and feature-branch dispatches select like PRs and skip it.
  qualification:
    needs: select
    if: ${{ needs.select.outputs.qualification == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps: [{uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262'}, {uses: ./.github/actions/docker-setup}, {run: make test-source-qualification}]

  # Post-merge tier (100 min covers test-exhaustive's 30 and sdk-python-test's 60 budgeted): the 16-seed sweeps and full-axis geodata round-trips that test-unit runs on two seeds or reduced axes, and the Python SDK with a live bot game.
  exhaustive:
    needs: select
    if: ${{ needs.select.outputs.exhaustive == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps: [{uses: 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262'}, {uses: ./.github/actions/docker-setup}, {run: make test-exhaustive}, {run: make sdk-python-test}]

  required:
    permissions: { contents: read, statuses: write }
    if: always()
    needs: [select, static, native-coverage, browser, e2e, target-performance, fuzz-smoke, qualification, exhaustive]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: ./.github/actions/docker-setup
      - run: make tools
      - name: Validate selection and selected jobs
        env:
          AOE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AOE_SELECTION_JSON: ${{ needs.select.outputs.manifest }}
          AOE_JOB_RESULTS_JSON: >-
            {"select":"${{ needs.select.result }}","static":"${{ needs.static.result }}","native-coverage":"${{ needs['native-coverage'].result }}","browser":"${{ needs.browser.result }}","e2e":"${{ needs.e2e.result }}","target-performance":"${{ needs['target-performance'].result }}","fuzz-smoke":"${{ needs['fuzz-smoke'].result }}","qualification":"${{ needs.qualification.result }}","exhaustive":"${{ needs.exhaustive.result }}"}
        run: make ci-check
      - name: Report dispatched aggregate as a commit status
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref_name != 'dev' && github.ref_name != 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: make ci-dispatch-status

  dev-artifacts:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/docker-setup
        with:
          cache: 'false'
      - run: make bootstrap
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with: { name: release-e2e-evidence, path: reports/e2e/ }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with: { name: performance-report, path: reports/perf/ }
      - run: make release-build
      - run: make release-verify
        env:
          AOE_RELEASE_MANIFEST: reports/release/${{ github.sha }}/manifest.json
      - name: Server SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: aoeworld/server:${{ github.sha }}
          format: spdx-json
          syft-version: v1.52.0
          output-file: reports/release/${{ github.sha }}/server.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Browser SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: aoeworld/browser:${{ github.sha }}
          format: spdx-json
          syft-version: v1.52.0
          output-file: reports/release/${{ github.sha }}/browser.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Static bundle SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: reports/release/${{ github.sha }}/bundle
          format: spdx-json
          syft-version: v1.52.0
          output-file: reports/release/${{ github.sha }}/bundle.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - id: published
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make release-publish
      - name: Log in for registry attestations
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attest server provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.published.outputs.server_name }}
          subject-digest: ${{ steps.published.outputs.server_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest browser provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.published.outputs.browser_name }}
          subject-digest: ${{ steps.published.outputs.browser_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest server SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.published.outputs.server_name }}
          subject-digest: ${{ steps.published.outputs.server_digest }}
          sbom-path: ${{ steps.published.outputs.release_dir }}/server.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest browser SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.published.outputs.browser_name }}
          subject-digest: ${{ steps.published.outputs.browser_digest }}
          sbom-path: ${{ steps.published.outputs.release_dir }}/browser.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest static bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.published.outputs.release_dir }}/bundle.tar
          sbom-path: ${{ steps.published.outputs.release_dir }}/bundle.spdx.json
      - name: Attest published manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ steps.published.outputs.release_dir }}/published.json
      - name: Publish verified dev build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "build-${GITHUB_SHA}"
          "reports/release/${GITHUB_SHA}/published.json"
          "reports/release/${GITHUB_SHA}/bundle.tar"
          "reports/release/${GITHUB_SHA}/checksums.txt"
          "reports/release/${GITHUB_SHA}/server.spdx.json"
          "reports/release/${GITHUB_SHA}/browser.spdx.json"
          "reports/release/${GITHUB_SHA}/bundle.spdx.json"
          "reports/release/${GITHUB_SHA}/e2e.json"
          "reports/release/${GITHUB_SHA}/perf.json"
          --target "${GITHUB_SHA}"
          --title "Verified dev build ${GITHUB_SHA}"
          --notes "Immutable AoeWorld Harness Lab build from verified dev source."
          --prerelease
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-release-diagnostics
          path: reports/release/
          retention-days: 30
          if-no-files-found: ignore

  release-candidate:
    if: >-
      ${{ github.event_name == 'pull_request' && github.base_ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/docker-setup
        with:
          cache: 'false'
      - id: source
        env:
          AOE_RELEASE_BRANCH: ${{ github.head_ref }}
        run: make release-source-check
      - name: Download the verified dev build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "build-${{ steps.source.outputs.source_sha }}"
          --dir "reports/release/${{ steps.source.outputs.source_sha }}"
      - id: verified
        env:
          AOE_RELEASE_BRANCH: ${{ github.head_ref }}
          AOE_RELEASE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: make release-verify-published
      - name: Authenticate for attestation verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify image and file OIDC attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${{ steps.verified.outputs.server_image }}" --repo "$GITHUB_REPOSITORY" --bundle-from-oci
          gh attestation verify "oci://${{ steps.verified.outputs.browser_image }}" --repo "$GITHUB_REPOSITORY" --bundle-from-oci
          gh attestation verify "oci://${{ steps.verified.outputs.server_image }}" --repo "$GITHUB_REPOSITORY" --bundle-from-oci --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify "oci://${{ steps.verified.outputs.browser_image }}" --repo "$GITHUB_REPOSITORY" --bundle-from-oci --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify "reports/release/${{ steps.source.outputs.source_sha }}/bundle.tar" --repo "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify "reports/release/${{ steps.source.outputs.source_sha }}/published.json" --repo "$GITHUB_REPOSITORY"
      - id: previous
        name: Download previous promoted release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download --pattern '*.json' --pattern '*.tar'
          --pattern '*.txt' --dir reports/release/previous
      - name: Verify previous release attestation
        if: steps.previous.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify reports/release/previous/published.json
          --repo "$GITHUB_REPOSITORY"
      - name: Rehearse exact digest promotion and rollback
        if: steps.previous.outcome == 'success'
        env:
          AOE_RELEASE_BRANCH: ${{ github.head_ref }}
          AOE_PREVIOUS_MANIFEST: reports/release/previous/published.json
          GITHUB_TOKEN: ${{ github.token }}
        run: make release-rehearse-published
      - name: Rehearse first published candidate
        if: steps.previous.outcome != 'success'
        env:
          AOE_RELEASE_BRANCH: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: make release-smoke-published
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate-diagnostics
          path: reports/release/
          retention-days: 30
          if-no-files-found: ignore

  main-promotion:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: ./.github/actions/docker-setup
        with:
          cache: 'false'
      - id: source
        run: make release-main-source-check
      - name: Download existing verified dev build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "build-${{ steps.source.outputs.source_sha }}"
          --dir "reports/release/${{ steps.source.outputs.source_sha }}"
      - id: verified
        env:
          AOE_RELEASE_BRANCH: release/${{ steps.source.outputs.source_sha }}
          AOE_RELEASE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: make release-verify-published
      - name: Authenticate for attestation verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify existing build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://${{ steps.verified.outputs.server_image }}" --repo "$GITHUB_REPOSITORY" --bundle-from-oci
          gh attestation verify "oci://${{ steps.verified.outputs.browser_image }}" --repo "$GITHUB_REPOSITORY" --bundle-from-oci
          gh attestation verify "oci://${{ steps.verified.outputs.server_image }}" --repo "$GITHUB_REPOSITORY" --bundle-from-oci --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify "oci://${{ steps.verified.outputs.browser_image }}" --repo "$GITHUB_REPOSITORY" --bundle-from-oci --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify "reports/release/${{ steps.source.outputs.source_sha }}/bundle.tar" --repo "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3
          gh attestation verify "reports/release/${{ steps.source.outputs.source_sha }}/published.json" --repo "$GITHUB_REPOSITORY"
      - name: Promote existing digests without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "build-${{ steps.source.outputs.source_sha }}"
          --prerelease=false --latest
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: main-promotion-diagnostics
          path: reports/release/
          retention-days: 30
          if-no-files-found: ignore
