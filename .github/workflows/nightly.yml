name: AoeWorld nightly validation

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0
      - uses: ./.github/actions/docker-setup
      - run: make bootstrap
      - run: make preflight
      - run: make test-source-qualification
      - run: make coverage
      - run: make browser-check
      - run: make test-e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-functional
          path: |
            reports/coverage/
            reports/wasm/
            reports/perf/browser.json
            browser/test-results/
          retention-days: 7
          if-no-files-found: ignore

  parser-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
      - uses: ./.github/actions/docker-setup
      - run: make fuzz-nightly
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-parser-fuzz
          path: |
            reports/fuzz/
            fuzz/artifacts/
          retention-days: 7
          if-no-files-found: ignore

  critical-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
      - uses: ./.github/actions/docker-setup
      - run: make mutation-nightly
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-critical-mutation
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  target-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
      - uses: ./.github/actions/docker-setup
      - run: make bootstrap
      - run: make perf-full
      - run: make perf-timing
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-performance
          path: reports/perf/
          retention-days: 30
          if-no-files-found: ignore

  network-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
      - uses: ./.github/actions/docker-setup
      - run: make bootstrap
      - run: make perf-soak-10
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightly-network-soak
          path: |
            reports/perf/soak-10.json
            reports/perf/soak-10.md
          retention-days: 30
          if-no-files-found: ignore

  # Runs last: one issue per failing job, closed when it passes again, and one
  # for metric regressions (docs/issues.md). The logic is `aoe-harness
  # nightly-triage` and `aoe-harness metric-regressions`.
  triage:
    if: always()
    needs: [full-functional, parser-fuzz, critical-mutation, target-performance, network-soak]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: nightly-triage
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dev
          fetch-depth: 0
      - uses: ./.github/actions/docker-setup
      - run: make tools
      - run: make nightly-triage
        env:
          NIGHTLY_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: make metric-regressions
        env:
          GH_TOKEN: ${{ github.token }}
