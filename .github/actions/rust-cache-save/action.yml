name: Save the Rust build cache
description: >-
  Save the cargo registry and target/ (without the workspace crates' own artifacts,
  which every checkout invalidates) of a job leg, only on a push to dev (so
  pull requests never evict it) and only when the restore step did not find
  this exact key. Run it as the last step of a green job.
inputs:
  leg:
    description: The same leg name the restore step used.
    required: true
runs:
  using: composite
  steps:
    - id: trim
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && env.RUST_CACHE_EXACT != 'true' }}
      shell: bash
      run: |
        du -sh target .git/aoe-cargo/registry .git/aoe-cargo/git 2>/dev/null || true
        rm -rf target/*/incremental target/tmp .git/aoe-cargo/registry/src
        # A checkout gives every source file a new mtime, so cargo rebuilds the workspace crates
        # whatever the cache holds: save the dependencies only (their fingerprints do not use mtimes).
        find target -depth \( -name 'aoe_*' -o -name 'libaoe_*' -o -name 'aoe-*' \) -exec rm -rf {} +
        find target -path '*/deps/*' -type f -perm -u+x ! -name '*.*' -delete
        du -sh target .git/aoe-cargo/registry .git/aoe-cargo/git 2>/dev/null || true
    - if: ${{ steps.trim.outcome == 'success' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          .git/aoe-cargo/registry
          .git/aoe-cargo/git
          target
        key: rust-shared-${{ inputs.leg }}-${{ hashFiles('Cargo.toml') }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/rust-tools.Dockerfile') }}
