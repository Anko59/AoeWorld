name: Restore the Rust build cache
description: >-
  Restore the cargo registry and target/ that the last push to dev saved for a
  job leg. The Docker builds mount both from the checkout, so they are plain
  host directories. Pull requests only read this cache.
inputs:
  leg:
    description: Names the job leg; legs build different targets, so keep separate caches.
    required: true
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          .git/aoe-cargo/registry
          .git/aoe-cargo/git
          target
        key: rust-shared-${{ inputs.leg }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/rust-tools.Dockerfile') }}
        restore-keys: rust-shared-${{ inputs.leg }}-
    - shell: bash
      run: |
        echo "rust-cache hit=${{ steps.restore.outputs.cache-hit }} matched=${{ steps.restore.outputs.cache-matched-key }}"
        echo "RUST_CACHE_EXACT=${{ steps.restore.outputs.cache-hit }}" >> "$GITHUB_ENV"
        du -sh target .git/aoe-cargo 2>/dev/null || true
