[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"

[bans]
multiple-versions = "warn"
wildcards = "allow" # Cargo workspace-inherited local paths are reported as wildcards by cargo-deny 0.20.2.

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# Mozilla's root certificates, bundled by ureq 3's native-tls feature (#900):
# a permissive data license, allowed for this one crate only.
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
